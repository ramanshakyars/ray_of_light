name: rayoflite
description: "A new Flutter project."
publish_to: 'none' 

# version: 1.0.0+9
version: 1.1.0+11

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.2.4
  http: ^0.13.4
  flutter_tts: ^3.5.0
  flutter_native_splash: ^2.4.6
  device_preview: ^1.2.0
  http_interceptor: ^1.0.2
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  calendar_date_picker2: ^2.0.1
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  android: true
  ios: true
  color: "#ffffff"       
  image: "assets/logo.png"
  android_gravity: center
  android_12:
    image: "assets/logo.png"
    color: "#ffffff"  

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/fonts/
    - assets/app-background.jpg
    - assets/red-background.png
    - assets/talk-to-light.png

  fonts:
    - family: Specimen
      fonts:
        - asset: assets/fonts/OpenSans_Condensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_SemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700


